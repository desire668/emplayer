name: EMPlayer
options:
  bundleIdPrefix: com.emplayer
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "15.0"
  findCarthageFrameworks: false

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_BITCODE: "NO"
    OTHER_LDFLAGS:
      - "-ObjC"
      - "-lc++"
      - "-lz"
      - "-lbz2"
      - "-liconv"

targets:
  EMPlayer:
    type: application
    platform: iOS
    sources:
      - path: Sources/EMPlayer
    resources:
      - path: Resources
    info:
      path: Sources/EMPlayer/Info.plist
      properties:
        CFBundleDevelopmentRegion: zh_CN
        CFBundleDisplayName: EMPlayer
        CFBundleName: EMPlayer
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        UIViewControllerBasedStatusBarAppearance: true
        UIBackgroundModes:
          - audio
          - fetch
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsInWebContent: true
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: 需要访问相册来选择视频文件
        NSPhotoLibraryUsageDescription: 需要访问相册来选择视频文件
        NSLocalNetworkUsageDescription: 需要访问本地网络以连接 Emby 服务器
        NSBonjourServices:
          - _emby-server._tcp
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Dark
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emplayer.app
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: Sources/EMPlayer/EMPlayer.entitlements
    dependencies:
      # 本地 Swift Package：EMPlayerCore（Models / EmbyAPI / Services / Utils）
      - package: EMPlayerCore
      - package: KSPlayer
      - package: KeychainSwift
      - package: Kingfisher
      - package: SwiftyJSON

packages:
  # 本地 SPM package（仓库根目录的 Package.swift 会产出 EMPlayerCore library）
  EMPlayerCore:
    path: .
  KSPlayer:
    url: https://github.com/kingslay/KSPlayer.git
    branch: main
  KeychainSwift:
    url: https://github.com/evgenyneu/keychain-swift.git
    from: 20.0.0
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher.git
    from: 7.0.0
  SwiftyJSON:
    url: https://github.com/SwiftyJSON/SwiftyJSON.git
    from: 5.0.0
