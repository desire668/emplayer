name: Build iOS App (CI)

# 触发条件：
# - push 到 main 分支
# - tag v* (发布版本)
# - PR 到 main
# - 手动触发 workflow_dispatch
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - '.github/labeler.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_configuration:
        description: 'Build Configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
      sign_export:
        description: 'Sign and Export IPA (requires Secrets)'
        required: false
        default: true
        type: boolean

# 环境变量（全局配置）
env:
  APP_NAME: EMPlayer
  DESTINATION: 'generic/platform=iOS'
  XCODEGEN_VERSION: '2.42.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================
  # JOB 1: 分析与生成 Xcode 项目
  # ===========================================================
  generate-project:
    name: 生成 Xcode 项目
    runs-on: macos-15
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: 安装 XcodeGen
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: |
          brew install xcodegen || true
          xcodegen --version || true
          # 如果 brew 版本缺失，直接下载预编译
          if ! command -v xcodegen &> /dev/null; then
            curl -L "https://github.com/yonaskolb/XcodeGen/releases/download/${{ env.XCODEGEN_VERSION }}/xcodegen.zip" -o /tmp/xcodegen.zip
            unzip -o /tmp/xcodegen.zip -d /usr/local/bin/
            xcodegen --version
          fi

      - name: 缓存 SwiftPM 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved', '**/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: 读取版本号
        id: version
        run: |
          # 从 git tag 读版本，否则 fallback
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.0"
          fi
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "版本: ${VERSION} (${BUILD_NUMBER})"

      - name: 生成 Xcode 项目
        run: |
          xcodegen generate --spec project.yml --use-cache || xcodegen generate --spec project.yml
          ls -la "${{ env.APP_NAME }}.xcodeproj"

      - name: 上传生成的 Xcode 项目（供下游 job 复用）
        uses: actions/upload-artifact@v4
        with:
          name: xcode-project
          path: |
            ${{ env.APP_NAME }}.xcodeproj/
            project.yml
            Package.swift
            Package.resolved
          retention-days: 7

  # ===========================================================
  # JOB 2: 构建 iOS Simulator 版 + 单元/集成测试（无签名要求）
  # ===========================================================
  build-simulator:
    name: 构建 iOS 模拟器 + 基本校验
    runs-on: macos-15
    needs: generate-project
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载 Xcode 项目 artifact
        uses: actions/download-artifact@v4
        with:
          name: xcode-project

      - name: 缓存 SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved', '**/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: 配置 Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 解析 Swift 包
        run: |
          xcodebuild \
            -project "${{ env.APP_NAME }}.xcodeproj" \
            -scheme "${{ env.APP_NAME }}" \
            -resolvePackageDependencies \
            -scmProvider system

      - name: 构建 Simulator 版本
        run: |
          xcodebuild \
            -project "${{ env.APP_NAME }}.xcodeproj" \
            -scheme "${{ env.APP_NAME }}" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | xcbeautify --renderer github-actions

      - name: 上传 Simulator .app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EMPlayer-Simulator
          path: |
            DerivedData/Build/Products/Debug-iphonesimulator/${{ env.APP_NAME }}.app
          if-no-files-found: ignore
          retention-days: 7

  # ===========================================================
  # JOB 3: 构建 Device 版 + 导出 IPA（签名可选）
  # ===========================================================
  build-device-ipa:
    name: 构建 iOS IPA (Device)
    runs-on: macos-15
    needs: [generate-project, build-simulator]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release]
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载 Xcode 项目 artifact
        uses: actions/download-artifact@v4
        with:
          name: xcode-project

      - name: 缓存 SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved', '**/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: 安装 xcbeautify
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: brew install xcbeautify

      - name: 配置 Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 决定构建配置
        id: config
        run: |
          CFG="${{ github.event.inputs.build_configuration || matrix.configuration }}"
          echo "config=${CFG}" >> $GITHUB_OUTPUT

      # ============= 可选：代码签名（仅当 Secrets 存在时启用） =============
      - name: 检查签名 Secrets 是否可用
        id: secrets-check
        run: |
          HAS_TEAM="false"
          if [ -n "${{ secrets.IOS_DEVELOPMENT_TEAM }}" ]; then
            HAS_TEAM="true"
          fi
          echo "has_team=${HAS_TEAM}" >> $GITHUB_OUTPUT

      - name: 设置代码签名
        if: steps.secrets-check.outputs.has_team == 'true'
        env:
          IOS_CODE_SIGN_IDENTITY: ${{ secrets.IOS_CODE_SIGN_IDENTITY }}
          IOS_PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.IOS_PROVISIONING_PROFILE_SPECIFIER }}
          IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
        run: |
          # 写入临时的 xcconfig
          mkdir -p Build
          cat > Build/Sign.xcconfig <<EOF
          DEVELOPMENT_TEAM = ${IOS_DEVELOPMENT_TEAM}
          CODE_SIGN_STYLE = Manual
          CODE_SIGN_IDENTITY = ${IOS_CODE_SIGN_IDENTITY:-"Apple Development"}
          PROVISIONING_PROFILE_SPECIFIER = ${IOS_PROVISIONING_PROFILE_SPECIFIER}
          CODE_SIGN_ENTITLEMENTS = Sources/EMPlayer/EMPlayer.entitlements
          EOF
          echo "签名 xcconfig 已生成"
          cat Build/Sign.xcconfig

      # 可选：使用 fastlane match 同步证书 / 描述文件（需额外配置）
      - name: 安装 fastlane (可选)
        if: steps.secrets-check.outputs.has_team == 'true'
        run: |
          if command -v gem &> /dev/null; then
            gem install fastlane --no-document 2>/dev/null || true
          fi

      - name: 解析 Swift 包
        run: |
          xcodebuild \
            -project "${{ env.APP_NAME }}.xcodeproj" \
            -scheme "${{ env.APP_NAME }}" \
            -resolvePackageDependencies \
            -scmProvider system

      - name: 注入版本号
        run: |
          VERSION="${{ needs.generate-project.outputs.version }}"
          BUILD="${{ needs.generate-project.outputs.build }}"
          echo "MARKETING_VERSION=${VERSION}" > Build/Version.xcconfig
          echo "CURRENT_PROJECT_VERSION=${BUILD}" >> Build/Version.xcconfig
          plutil -replace CFBundleShortVersionString -string "${VERSION}" Sources/EMPlayer/Info.plist 2>/dev/null || true
          plutil -replace CFBundleVersion -string "${BUILD}" Sources/EMPlayer/Info.plist 2>/dev/null || true

      # ============= 真机构建（分两段，避免无签名场景下 archive 签名校验失败） =============
      # ① xcodebuild build-for-testing / build：先把 .app 编出来（只需要 device SDK，不需要签名授权）
      - name: 构建 iOS 真机 Release .app（无签名也可通过）
        id: build-device
        env:
          SIGN: ${{ steps.secrets-check.outputs.has_team }}
        run: |
          CFG="${{ steps.config.outputs.config }}"
          EXTRA_ARGS=()
          if [ "${SIGN}" == "true" ]; then
            EXTRA_ARGS+=(-xcconfig "Build/Sign.xcconfig")
          else
            # 无签名归档：完整关闭所有 code signing + 禁用 entitlements 校验
            EXTRA_ARGS+=(CODE_SIGNING_ALLOWED=NO)
            EXTRA_ARGS+=(CODE_SIGNING_REQUIRED=NO)
            EXTRA_ARGS+=(ENFORCE_CODE_SIGNING_WHILE_ARCHIVING=NO)
            EXTRA_ARGS+=(ENTITLEMENTS_REQUIRED=NO)
            EXTRA_ARGS+=(CODE_SIGN_IDENTITY="")
            EXTRA_ARGS+=(CODE_SIGNING_ENTITLEMENTS="")
            EXTRA_ARGS+=(PROVISIONING_PROFILE_SPECIFIER="")
            EXTRA_ARGS+=(PROVISIONING_PROFILE="")
            EXTRA_ARGS+=(DEVELOPMENT_TEAM="")
            EXTRA_ARGS+=(EXPANDED_CODE_SIGN_IDENTITY="")
            EXTRA_ARGS+=(EXPANDED_CODE_SIGN_IDENTITY_NAME="")
            EXTRA_ARGS+=(OTHER_CODE_SIGN_FLAGS="--skip-code-signature")
          fi
          if [ -f Build/Version.xcconfig ]; then
            EXTRA_ARGS+=(-xcconfig "Build/Version.xcconfig")
          fi

          set +e
          LOG_FILE="Build/build-device.log"
          mkdir -p Build
          xcodebuild \
            -project "${{ env.APP_NAME }}.xcodeproj" \
            -scheme "${{ env.APP_NAME }}" \
            -configuration "${CFG}" \
            -sdk iphoneos \
            -derivedDataPath DerivedData \
            -scmProvider system \
            -quiet \
            "${EXTRA_ARGS[@]}" \
            build 2>&1 | tee "${LOG_FILE}" | xcbeautify --renderer github-actions
          RC=${PIPESTATUS[0]}
          set -e

          echo "xcodebuild build 返回码: ${RC}"
          # 找到编出来的 .app（可能落在几个不同位置）
          APP=""
          for p in \
            "DerivedData/Build/Products/${CFG}-iphoneos/${{ env.APP_NAME }}.app" \
            "DerivedData/Build/Intermediates.noindex/ArchiveIntermediates/${{ env.APP_NAME }}/InstallationBuildProductsLocation/Applications/${{ env.APP_NAME }}.app" \
            "DerivedData/Build/Intermediates.noindex/${{ env.APP_NAME }}/Build/Products/${CFG}-iphoneos/${{ env.APP_NAME }}.app"; do
            if [ -d "$p" ]; then APP="$p"; break; fi
          done
          if [ -z "${APP}" ]; then
            echo "❌ 未找到编译后的 .app，列出 DerivedData 供诊断："
            find DerivedData -maxdepth 6 -name "*.app" -type d 2>/dev/null || true
            tail -n 200 "${LOG_FILE}" || true
            exit 1
          fi
          echo "✅ 已找到 .app: ${APP}"
          ls -lh "${APP}"
          echo "app_path=${APP}" >> $GITHUB_OUTPUT

      # ② 优先 xcodebuild archive（有签名 Secrets 时 100% 正确结构，dSYM 齐全）
      #    无签名时若失败 → 不报错，直接走 ③ 手动构造 xcarchive
      - name: 归档 iOS 设备版（优先 xcodebuild archive）
        id: archive-native
        env:
          DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          SIGN: ${{ steps.secrets-check.outputs.has_team }}
        continue-on-error: true
        run: |
          CFG="${{ steps.config.outputs.config }}"
          EXTRA_ARGS=()
          if [ "${SIGN}" == "true" ]; then
            EXTRA_ARGS+=(-xcconfig "Build/Sign.xcconfig")
          else
            # 无签名 + 最宽松的签名检查集
            EXTRA_ARGS+=(CODE_SIGNING_ALLOWED=NO)
            EXTRA_ARGS+=(CODE_SIGNING_REQUIRED=NO)
            EXTRA_ARGS+=(ENTITLEMENTS_REQUIRED=NO)
            EXTRA_ARGS+=(ENFORCE_CODE_SIGNING_WHILE_ARCHIVING=NO)
            EXTRA_ARGS+=(CODE_SIGN_IDENTITY="")
            EXTRA_ARGS+=(CODE_SIGNING_ENTITLEMENTS="")
            EXTRA_ARGS+=(PROVISIONING_PROFILE_SPECIFIER="")
            EXTRA_ARGS+=(DEVELOPMENT_TEAM="")
            EXTRA_ARGS+=(EXPANDED_CODE_SIGN_IDENTITY="")
          fi
          if [ -f Build/Version.xcconfig ]; then
            EXTRA_ARGS+=(-xcconfig "Build/Version.xcconfig")
          fi

          set -o pipefail
          xcodebuild \
            -project "${{ env.APP_NAME }}.xcodeproj" \
            -scheme "${{ env.APP_NAME }}" \
            -configuration "${CFG}" \
            -destination "${{ env.DESTINATION }}" \
            -archivePath "Build/${{ env.APP_NAME }}.xcarchive" \
            -derivedDataPath DerivedData \
            -scmProvider system \
            "${EXTRA_ARGS[@]}" \
            archive | xcbeautify --renderer github-actions

      # ③ 如果 ② 失败 → 手动拼一个 xcarchive 目录结构（用户本地重签完全等价）
      - name: 手动构造 xcarchive（当 xcodebuild archive 失败时兜底）
        id: archive
        env:
          APP_PATH: ${{ steps.build-device.outputs.app_path }}
        run: |
          XCA="Build/${{ env.APP_NAME }}.xcarchive"
          # 如果原生 archive 成功了，直接确认存在即可
          if [ -d "${XCA}/Products/Applications/${{ env.APP_NAME }}.app" ]; then
            echo "✅ 原生 archive 已成功生成: ${XCA}"
            ls -la "${XCA}"
            echo "mode=native" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "ℹ️ 原生 archive 未生成，改用手动构造 xcarchive"
          rm -rf "${XCA}"
          mkdir -p "${XCA}/Products/Applications"
          mkdir -p "${XCA}/dSYMs"

          # 复制 .app（strip 掉空的 _CodeSignature，避免后续重签冲突）
          cp -R "${APP_PATH}" "${XCA}/Products/Applications/"
          rm -rf "${XCA}/Products/Applications/${{ env.APP_NAME }}.app/_CodeSignature" 2>/dev/null || true
          rm -f  "${XCA}/Products/Applications/${{ env.APP_NAME }}.app/embedded.mobileprovision" 2>/dev/null || true

          # 把 DerivedData 里能找到的 dSYM 拷到 xcarchive/dSYMs（如果有）
          find DerivedData -maxdepth 8 -name "*.dSYM" -type d 2>/dev/null | while read -r dSYM; do
            cp -R "${dSYM}" "${XCA}/dSYMs/" 2>/dev/null || true
          done || true

          # 写入 xcarchive 的 Info.plist（Xcode 识别 xcarchive 的必备文件）
          VERSION="${{ needs.generate-project.outputs.version }}"
          BUILD="${{ needs.generate-project.outputs.build }}"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${APP_PATH}/Info.plist" 2>/dev/null || echo "com.emplayer.app")
          cat > "${XCA}/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>ApplicationProperties</key>
              <dict>
                  <key>ApplicationPath</key>
                  <string>Applications/${{ env.APP_NAME }}.app</string>
                  <key>ArchiveVersion</key>
                  <integer>2</integer>
                  <key>CFBundleIdentifier</key>
                  <string>${BUNDLE_ID}</string>
                  <key>CFBundleShortVersionString</key>
                  <string>${VERSION}</string>
                  <key>CFBundleVersion</key>
                  <string>${BUILD}</string>
                  <key>SigningIdentity</key>
                  <string>-</string>
              </dict>
              <key>CreationDate</key>
              <date>$(date -u +%Y-%m-%dT%H:%M:%SZ)</date>
              <key>Name</key>
              <string>${{ env.APP_NAME }}</string>
              <key>SchemeName</key>
              <string>${{ env.APP_NAME }}</string>
          </dict>
          </plist>
          PLIST

          echo "✅ 手动 xcarchive 完成: ${XCA}"
          ls -laR "${XCA}" | head -80
          echo "mode=manual" >> $GITHUB_OUTPUT

      - name: 上传 xcarchive
        if: always() && steps.archive.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: EMPlayer-xcarchive-${{ matrix.configuration }}
          path: Build/${{ env.APP_NAME }}.xcarchive
          retention-days: 14
          compression-level: 6
          if-no-files-found: ignore

      # ============= 路径 A：如果配置了签名 Secrets → 正式签名导出 IPA =============
      - name: 生成 ExportOptions.plist
        if: steps.secrets-check.outputs.has_team == 'true'
        id: export-options
        env:
          EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD || 'development' }}
          IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          IOS_PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.IOS_PROVISIONING_PROFILE_SPECIFIER }}
        run: |
          EXPORT_DIR="Build/Export"
          mkdir -p "${EXPORT_DIR}"
          cat > "${EXPORT_DIR}/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>${EXPORT_METHOD}</string>
              <key>teamID</key>
              <string>${IOS_DEVELOPMENT_TEAM}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.emplayer.app</key>
                  <string>${IOS_PROVISIONING_PROFILE_SPECIFIER}</string>
              </dict>
              <key>signingCertificate</key>
              <string>${{ secrets.IOS_CODE_SIGN_IDENTITY || 'Apple Distribution' }}</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>uploadBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
              <key>thinning</key>
              <string>&lt;none&gt;</string>
          </dict>
          </plist>
          PLIST
          cat "${EXPORT_DIR}/ExportOptions.plist"
          echo "options=${EXPORT_DIR}/ExportOptions.plist" >> $GITHUB_OUTPUT

      - name: 导出已签名 IPA
        if: steps.secrets-check.outputs.has_team == 'true' && steps.archive.outcome == 'success'
        id: export
        env:
          DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
        run: |
          EXPORT_DIR="Build/Export"
          mkdir -p "${EXPORT_DIR}"
          xcodebuild \
            -exportArchive \
            -archivePath "Build/${{ env.APP_NAME }}.xcarchive" \
            -exportPath "${EXPORT_DIR}" \
            -exportOptionsPlist "${{ steps.export-options.outputs.options }}" \
            -allowProvisioningUpdates \
            | xcbeautify --renderer github-actions

          IPA=$(find "${EXPORT_DIR}" -maxdepth 2 -name "*.ipa" | head -n 1)
          if [ -n "${IPA}" ]; then
            echo "✅ 已签名 IPA 导出成功: ${IPA}"
            ls -lh "${IPA}"
            VERSION="${{ needs.generate-project.outputs.version }}"
            BUILD="${{ needs.generate-project.outputs.build }}"
            FINAL="Build/${{ env.APP_NAME }}-${VERSION}-${BUILD}.ipa"
            cp "${IPA}" "${FINAL}"
            echo "ipa_path=${IPA}" >> $GITHUB_OUTPUT
            echo "final_ipa=${FINAL}" >> $GITHUB_OUTPUT
            echo "signed=true" >> $GITHUB_OUTPUT
          else
            echo "❌ IPA 未生成"
            ls -R "${EXPORT_DIR}"
            exit 1
          fi

      # ============= 路径 B：未配置签名 Secrets → 从 xcarchive 打 Unsigned IPA =============
      # 这样用户下载后可用自己的证书重签（Sideloadly / AltStore / codesign）
      - name: 打包 Unsigned IPA（无签名 Secrets 时兜底）
        if: steps.secrets-check.outputs.has_team != 'true' && steps.archive.outcome == 'success'
        id: export-unsigned
        run: |
          APP_PATH="Build/${{ env.APP_NAME }}.xcarchive/Products/Applications/${{ env.APP_NAME }}.app"
          if [ ! -d "${APP_PATH}" ]; then
            echo "❌ 未找到 .app: ${APP_PATH}"
            ls -la "Build/${{ env.APP_NAME }}.xcarchive/Products/Applications/" 2>/dev/null || true
            exit 1
          fi

          VERSION="${{ needs.generate-project.outputs.version }}"
          BUILD="${{ needs.generate-project.outputs.build }}"
          STAGE="Build/UnsignedStage"
          rm -rf "${STAGE}"
          mkdir -p "${STAGE}/Payload"
          cp -R "${APP_PATH}" "${STAGE}/Payload/"

          # 剔除归档里已有的 _CodeSignature / 嵌入式描述文件（都是空的/无效的，重签时会重写）
          rm -rf "${STAGE}/Payload/${{ env.APP_NAME }}.app/_CodeSignature" 2>/dev/null || true
          rm -f  "${STAGE}/Payload/${{ env.APP_NAME }}.app/embedded.mobileprovision" 2>/dev/null || true

          FINAL="Build/${{ env.APP_NAME }}-${VERSION}-${BUILD}-unsigned.ipa"
          (cd "${STAGE}" && zip -qry "../${FINAL##*/}" Payload/)
          mv "${STAGE}/../${FINAL##*/}" "${FINAL}" 2>/dev/null || true
          if [ ! -f "${FINAL}" ]; then
            # macOS /usr/bin/zip 相对路径表现不同，保险起见再打一次
            pushd "${STAGE}" >/dev/null
            zip -qry "../UnsignedOutput.ipa" Payload/
            popd >/dev/null
            mv "Build/UnsignedOutput.ipa" "${FINAL}"
          fi

          echo "✅ Unsigned IPA 打包完成: ${FINAL}"
          ls -lh "${FINAL}"
          echo "final_ipa=${FINAL}" >> $GITHUB_OUTPUT
          echo "signed=false" >> $GITHUB_OUTPUT

      # ============= 合并输出：无论是已签名 / unsigned，统一 IPA artifact 名 =============
      - name: 汇总 IPA 并上传 Artifact
        if: steps.archive.outcome == 'success'
        id: upload-ipa
        run: |
          # 优先取路径 A 已签名，否则路径 B unsigned
          IPA_A="${{ steps.export.outputs.final_ipa }}"
          IPA_B="${{ steps.export-unsigned.outputs.final_ipa }}"
          FINAL=""
          if [ -f "${IPA_A}" ]; then
            FINAL="${IPA_A}"
            KIND="signed"
          elif [ -f "${IPA_B}" ]; then
            FINAL="${IPA_B}"
            KIND="unsigned"
          else
            echo "❌ 任何 IPA 都未生成"
            ls -R Build/ | head -200
            exit 1
          fi
          echo "最终 IPA: ${FINAL} (${KIND})"
          ls -lh "${FINAL}"
          echo "final_ipa=${FINAL}" >> $GITHUB_OUTPUT
          echo "kind=${KIND}" >> $GITHUB_OUTPUT

          # 放一个统一目录方便 release job 下载
          OUT="Build/IPA-Final"
          mkdir -p "${OUT}"
          cp "${FINAL}" "${OUT}/"
          # 额外附带一个 README，说明 unsigned IPA 需要重签
          if [ "${KIND}" = "unsigned" ]; then
            cat > "${OUT}/README-重签说明.txt" <<'TXT'
          该 IPA 是未签名版本（unsigned IPA），必须使用你自己的证书和描述文件重签后才能安装。

          推荐重签工具：
            1. Sideloadly（免费，GUI，Windows / macOS） https://sideloadly.io
               - 拖入 IPA + Apple ID → 开始 → 会自动重签并安装到连接的设备
            2. AltStore（免费，自签 7 天有效）https://altstore.io
            3. 命令行（需已安装证书 + 描述文件）：
               $ unzip EMPlayer-xxx-unsigned.ipa
               $ /usr/libexec/PlistBuddy -c 'Print :application-identifier' \
                   "/path/to/your.mobileprovision"   # 查 Team+bundle id
               $ cp /path/to/your.mobileprovision Payload/EMPlayer.app/embedded.mobileprovision
               $ /usr/bin/codesign --force --sign "Apple Development: Your Name (TEAMID)" \
                   --entitlements entitlements.plist \
                   Payload/EMPlayer.app
               $ zip -qry EMPlayer-resigned.ipa Payload
            4. iOS App Signer（macOS GUI） https://dantheman827.github.io/ios-app-signer/

          免费 Apple ID 重签的应用有效期为 7 天，开发者证书 1 年。
          TXT
          fi

      - name: 上传 IPA 构建产物
        if: steps.upload-ipa.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: EMPlayer-IPA-${{ matrix.configuration }}
          path: |
            Build/IPA-Final/*.ipa
            Build/IPA-Final/*.txt
          retention-days: 90
          compression-level: 0

      - name: dSYM 符号上传
        if: steps.archive.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: EMPlayer-dSYM-${{ matrix.configuration }}
          path: Build/${{ env.APP_NAME }}.xcarchive/dSYMs/*.dSYM
          retention-days: 90
          compression-level: 6
          if-no-files-found: ignore

  # ===========================================================
  # JOB 4: 上传 Release（仅 tag v* 且 IPA 构建成功时）
  # ===========================================================
  release:
    name: 发布 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-device-ipa]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: EMPlayer-IPA-*
          merge-multiple: true

      - name: 列出下载产物
        run: |
          ls -lhR artifacts/ || true

      - name: 生成 Release Notes (Changelog)
        id: notes
        run: |
          cat > ReleaseNotes.md <<'MD'
          # EMPlayer ${{ github.ref_name }}
          
          ## What's Changed
          - 基于 KSPlayer 内核的 Emby iOS 播放器首发版本
          - 支持 Emby 服务器连接、多服务器切换
          - 支持电影/剧集/音乐/图片浏览
          - 支持直连播放 / HLS 转码
          - 支持外挂字幕 (SRT/ASS/VTT)
          - 支持播放进度同步到 Emby 服务器
          - 支持后台音频播放
          
          ## 安装说明
          1. 下载下面的 `.ipa` 文件
          2. 通过 `sideloadly` / `AltStore` / Apple Configurator 或企业证书部署到设备
          3. 首次打开应用，添加 Emby 服务器地址并登录
          
          ## 系统要求
          - iOS 15.0+
          - iPhone / iPad
          MD
          echo "notes=ReleaseNotes.md" >> $GITHUB_OUTPUT

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: EMPlayer ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.notes }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') }}
          fail_on_unmatched_files: false
          files: |
            artifacts/*.ipa
